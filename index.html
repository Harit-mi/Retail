<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Android & iOS Mobile Optimization Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E3A5F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DukaanPOS" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>DukaanPOS — Multi-Vertical Retail POS for India</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Google Fonts Preconnect: Premium Clean Typography (Outfit, Plus Jakarta Sans, Poppins, Space Grotesk, JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- FontAwesome 6 Icons from FontAwesome.com CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body class="antialiased selection:bg-[#F5A623] selection:text-slate-950">
    <div id="root">
      <div id="initial-loading-fallback" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #FAFAF9; color: #18181b; padding: 20px; text-align: center;">
        <div style="width: 36px; height: 36px; border: 3px solid #18181b; border-top-color: transparent; border-radius: 50%; animation: dukaan-spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <style>@keyframes dukaan-spin { to { transform: rotate(360deg); } }</style>
        <div style="font-weight: 800; font-size: 16px; letter-spacing: -0.02em; margin-bottom: 4px;">
          DUKAAN<span style="color: #d97706;">POS</span>
        </div>
        <div style="font-size: 12px; color: #71717a; font-family: monospace;">
          Loading Universal Retail POS...
        </div>
        <div id="fallback-reload-btn" style="display: none; margin-top: 20px;">
          <p style="font-size: 12px; color: #ef4444; margin-bottom: 8px;">Taking longer than expected?</p>
          <button onclick="localStorage.clear(); sessionStorage.clear(); if('caches' in window){caches.keys().then(function(keys){keys.forEach(function(k){caches.delete(k);})})}; if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(r){r.unregister();})})}; window.location.reload(true);" style="padding: 8px 16px; background-color: #18181b; color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;">
            Clear Browser Cache & Reload
          </button>
        </div>
        <script>
          setTimeout(function() {
            var btn = document.getElementById('fallback-reload-btn');
            if (btn) btn.style.display = 'block';
          }, 2000);
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Clean up stale development service workers & caches on localhost / 127.0.0.1
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          });
        }
      }
    </script>
  </body>
</html>
